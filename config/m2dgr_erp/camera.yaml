%YAML:1.0

camera_model: equirectangular
image_topic: /odgs/panorama
image_width: 1024
image_height: 512
valid_mask_path: /workspace/output/datasets/m2dgr/room_01_odgs_valid_mask.png

# Legacy perspective members remain required by the visual frontend. ERP
# projection uses spherical directions and ignores these values.
cam_fx: 1.0
cam_fy: 1.0
cam_cx: 512.0
cam_cy: 256.0
cam_d0: 0.0
cam_d1: 0.0
cam_d2: 0.0
cam_d3: 0.0
cam_d4: 0.0

# Virtual ERP camera to Handsfree IMU. The ERP origin is the camera-ring
# center at [0, 0, -0.167] in the LiDAR frame.
CameraExtrinsics:
    Trans: [0.27255, -0.00053, 0.01254]
    Rot: [0, 0, 1,
          -1, 0, 0,
          0, -1, 0]

img_time_offset: 0.0
