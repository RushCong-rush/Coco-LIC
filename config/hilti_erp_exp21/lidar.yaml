lidar0:
    topic: /hesai/pandar
    is_livox: false
    Extrinsics:
        Trans: [-0.001, -0.00855, 0.055]
        Rot: [0, -1, 0,
              -1, 0, 0,
              0, 0, -1]
num_lidars: 1
lidar_timestamp_end: false

VLP16:
    N_SCAN: 32
    Horizon_SCAN: 1800
    edge_threshold: 1.0
    surf_threshold: 0.1
    odometry_surface_leaf_size: 0.3
    min_distance: 1.0
    max_distance: 80.0

use_corner_feature: false
current_scan_param:
    corner_leaf_size: 0.3
    surface_leaf_size: 0.3
    edge_min_valid_num: 10
    surf_min_valid_num: 100
    correspondence_downsample: 2
keyframe_strategy:
    angle_degree: 10
    dist_meter: 1.0
    time_second: 10
map_param:
    keyframe_search_radius: 35.0
    keyframe_search_time: 10.0
    keyframe_density: 0.5
    cloud_reserved_time: -1
